name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE="$(curl -sS --fail \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          # -e: .value yoksa/null ise exit != 0, set -e step'i kirmiziya cevirir.
          TOKEN="$(echo "$TOKEN_RESPONSE" | jq -er '.value')"

          # JWT payload'i base64url ve padding'siz: once /+ alfabesine cevir,
          # sonra uzunlugu 4'un katina tamamla yoksa `base64 -d` reddeder.
          B64="$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#B64} % 4 )) in
            2) B64="${B64}==" ;;
            3) B64="${B64}=" ;;
          esac

          echo "$B64" | base64 -d | jq

